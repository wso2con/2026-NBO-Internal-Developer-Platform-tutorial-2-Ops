    mopay-001-schema.psql: "-- mopay schema. Money is ALWAYS integer minor units (bigint). Currency always\
      \ explicit.\n-- All timestamps are timestamptz, stored UTC. See PRD \xA77.\n\nCREATE TABLE IF NOT\
      \ EXISTS merchants (\n    id                     text PRIMARY KEY,\n    name                   text\
      \        NOT NULL,\n    country                text        NOT NULL CHECK (country IN ('KE','NG')),\n\
      \    -- RES-5: immutable after creation. Enforced by trigger below.\n    data_region           \
      \ text        NOT NULL CHECK (data_region IN ('KE','NG')),\n    payout_bank            text    \
      \    NOT NULL,\n    payout_account_number  text        NOT NULL,\n    payout_account_name    text\
      \        NOT NULL,\n    float_limit_minor      bigint      NOT NULL CHECK (float_limit_minor >=\
      \ 0),\n    float_limit_currency   text        NOT NULL,\n    created_at             timestamptz\
      \ NOT NULL DEFAULT now()\n);\n\n-- RES-5 / \xA77: Merchant.dataRegion is set at creation and immutable.\n\
      CREATE OR REPLACE FUNCTION merchants_data_region_immutable() RETURNS trigger AS $$\nBEGIN\n    IF\
      \ NEW.data_region IS DISTINCT FROM OLD.data_region THEN\n        RAISE EXCEPTION\n            'merchant\
      \ % data_region is immutable (RES-5): attempted change from % to %',\n            OLD.id, OLD.data_region,\
      \ NEW.data_region;\n    END IF;\n    RETURN NEW;\nEND;\n$$ LANGUAGE plpgsql;\n\nDROP TRIGGER IF\
      \ EXISTS trg_merchants_data_region_immutable ON merchants;\nCREATE TRIGGER trg_merchants_data_region_immutable\n\
      \    BEFORE UPDATE ON merchants\n    FOR EACH ROW EXECUTE FUNCTION merchants_data_region_immutable();\n\
      \n-- C-2.8: per-merchant, per-channel percentage (basis points, integer - never a float)\n-- plus\
      \ a fixed component in minor units.\nCREATE TABLE IF NOT EXISTS fee_schedules (\n    merchant_id\
      \    text   NOT NULL REFERENCES merchants(id) ON DELETE CASCADE,\n    channel        text   NOT\
      \ NULL,\n    percentage_bp  int    NOT NULL CHECK (percentage_bp >= 0 AND percentage_bp <= 10000),\n\
      \    fixed_minor    bigint NOT NULL CHECK (fixed_minor >= 0),\n    PRIMARY KEY (merchant_id, channel)\n\
      );\n\nCREATE TABLE IF NOT EXISTS collections (\n    id                  text        PRIMARY KEY,\n\
      \    merchant_id         text        NOT NULL REFERENCES merchants(id),\n    channel           \
      \  text        NOT NULL CHECK (channel IN ('mpesa','nibss_transfer')),\n    amount_minor       \
      \ bigint      NOT NULL CHECK (amount_minor > 0),\n    currency            text        NOT NULL CHECK\
      \ (currency IN ('KES','NGN')),\n    customer_reference  text        NOT NULL,\n    merchant_reference\
      \  text        NOT NULL,\n    origin_country      text        NOT NULL CHECK (origin_country IN\
      \ ('KE','NG')),\n    status              text        NOT NULL CHECK (status IN ('pending','cleared','failed','settled')),\n\
      \    created_at          timestamptz NOT NULL DEFAULT now(),\n    cleared_at          timestamptz,\n\
      \    settled_at          timestamptz,\n    settlement_line_id  text,\n    -- C-1.3: idempotency\
      \ is a database constraint, not an application-level check.\n    CONSTRAINT collections_merchant_reference_unique\
      \ UNIQUE (merchant_id, merchant_reference)\n);\n\nCREATE INDEX IF NOT EXISTS idx_collections_merchant_created\
      \ ON collections (merchant_id, created_at DESC);\nCREATE INDEX IF NOT EXISTS idx_collections_status_cleared\
      \   ON collections (status, cleared_at);\nCREATE INDEX IF NOT EXISTS idx_collections_merchant_status\
      \  ON collections (merchant_id, status);\n\n-- C-1.6: status transitions are one-directional. pending\
      \ -> cleared -> settled, or pending -> failed.\nCREATE OR REPLACE FUNCTION collections_status_forward_only()\
      \ RETURNS trigger AS $$\nDECLARE\n    rank_old int;\n    rank_new int;\nBEGIN\n    rank_old := CASE\
      \ OLD.status WHEN 'pending' THEN 0 WHEN 'cleared' THEN 1\n                                WHEN 'failed'\
      \  THEN 2 WHEN 'settled' THEN 2 END;\n    rank_new := CASE NEW.status WHEN 'pending' THEN 0 WHEN\
      \ 'cleared' THEN 1\n                                WHEN 'failed'  THEN 2 WHEN 'settled' THEN 2\
      \ END;\n    IF NEW.status IS DISTINCT FROM OLD.status THEN\n        IF rank_new < rank_old THEN\n\
      \            RAISE EXCEPTION\n                'collection % illegal status transition % -> % (C-1.6:\
      \ transitions are one-directional)',\n                OLD.id, OLD.status, NEW.status;\n        END\
      \ IF;\n        IF OLD.status = 'failed' OR OLD.status = 'settled' THEN\n            RAISE EXCEPTION\n\
      \                'collection % is terminal in status % and cannot move to % (C-1.6)',\n        \
      \        OLD.id, OLD.status, NEW.status;\n        END IF;\n        IF OLD.status = 'pending' AND\
      \ NEW.status = 'settled' THEN\n            RAISE EXCEPTION\n                'collection % cannot\
      \ settle directly from pending (C-1.6: must clear first)',\n                OLD.id;\n        END\
      \ IF;\n    END IF;\n    RETURN NEW;\nEND;\n$$ LANGUAGE plpgsql;\n\nDROP TRIGGER IF EXISTS trg_collections_status_forward_only\
      \ ON collections;\nCREATE TRIGGER trg_collections_status_forward_only\n    BEFORE UPDATE ON collections\n\
      \    FOR EACH ROW EXECUTE FUNCTION collections_status_forward_only();\n\n-- C-2.5: full run record.\n\
      CREATE TABLE IF NOT EXISTS settlement_runs (\n    id              text        PRIMARY KEY,\n   \
      \ run_type        text        NOT NULL CHECK (run_type IN ('nightly','monthEnd')),\n    status \
      \         text        NOT NULL CHECK (status IN ('pending','running','completed','failed')),\n \
      \   started_at      timestamptz NOT NULL,\n    ended_at        timestamptz,\n    row_count     \
      \  bigint      NOT NULL DEFAULT 0,\n    failure_reason  text,\n    period_start    timestamptz NOT\
      \ NULL,\n    period_end      timestamptz NOT NULL,\n    region          text        NOT NULL CHECK\
      \ (region IN ('KE','NG'))\n);\n\nCREATE INDEX IF NOT EXISTS idx_runs_started ON settlement_runs\
      \ (started_at DESC);\nCREATE INDEX IF NOT EXISTS idx_runs_status  ON settlement_runs (status, started_at\
      \ DESC);\n\n-- C-2.3 / NFR-6: immutable. UPDATE and DELETE are revoked from the app role in 002.\n\
      CREATE TABLE IF NOT EXISTS settlement_lines (\n    id               text        PRIMARY KEY,\n \
      \   run_id           text        NOT NULL REFERENCES settlement_runs(id),\n    merchant_id     \
      \ text        NOT NULL REFERENCES merchants(id),\n    gross_minor      bigint      NOT NULL,\n \
      \   fees_minor       bigint      NOT NULL,\n    net_minor        bigint      NOT NULL,\n    currency\
      \         text        NOT NULL,\n    -- C-2.3: corrections would reference the line they correct.\
      \ SCOPE.md conflict 6 -\n    -- the column exists and is always NULL; there is no correction code\
      \ path.\n    corrects_line_id text        REFERENCES settlement_lines(id),\n    row_count      \
      \  bigint      NOT NULL DEFAULT 0,\n    created_at       timestamptz NOT NULL DEFAULT now(),\n \
      \   -- C-2.7: one line per merchant per run. Re-running cannot double-write.\n    CONSTRAINT settlement_lines_run_merchant_unique\
      \ UNIQUE (run_id, merchant_id)\n);\n\nCREATE INDEX IF NOT EXISTS idx_lines_merchant ON settlement_lines\
      \ (merchant_id, created_at DESC);\n\n-- C-2.4: one payout instruction per merchant per completed\
      \ run.\nCREATE TABLE IF NOT EXISTS payout_instructions (\n    id                 text        PRIMARY\
      \ KEY,\n    settlement_line_id text        NOT NULL UNIQUE REFERENCES settlement_lines(id),\n  \
      \  merchant_id        text        NOT NULL REFERENCES merchants(id),\n    bank               text\
      \        NOT NULL,\n    account_number     text        NOT NULL,\n    account_name       text  \
      \      NOT NULL,\n    amount_minor       bigint      NOT NULL,\n    currency           text    \
      \    NOT NULL,\n    status             text        NOT NULL DEFAULT 'emitted',\n    created_at \
      \        timestamptz NOT NULL DEFAULT now()\n);\n\n-- C-3.3 / hard constraint 1: append-only. UPDATE\
      \ and DELETE revoked in 002.\nCREATE TABLE IF NOT EXISTS ledger_entries (\n    id              \
      \     text        PRIMARY KEY,\n    merchant_id          text        NOT NULL REFERENCES merchants(id),\n\
      \    direction            text        NOT NULL CHECK (direction IN ('debit','credit')),\n    amount_minor\
      \         bigint      NOT NULL CHECK (amount_minor > 0),\n    currency             text        NOT\
      \ NULL,\n    created_at           timestamptz NOT NULL DEFAULT now(),\n    -- C-3.4: every entry\
      \ references the business event that produced it.\n    event_type           text        NOT NULL\
      \ CHECK (event_type IN ('collection','fee','settlement','correction')),\n    event_id          \
      \   text        NOT NULL,\n    -- C-3.5: entries sharing this must sum to zero.\n    transaction_group_id\
      \ text        NOT NULL\n);\n\nCREATE INDEX IF NOT EXISTS idx_ledger_merchant_created ON ledger_entries\
      \ (merchant_id, created_at);\nCREATE INDEX IF NOT EXISTS idx_ledger_group            ON ledger_entries\
      \ (transaction_group_id);\nCREATE INDEX IF NOT EXISTS idx_ledger_event            ON ledger_entries\
      \ (event_type, event_id);\n"
    mopay-002-append-only-grants.psql: |
      -- Hard constraint 1 (README.md) / C-3.3 / NFR-6.
      --
      -- `ledger_entries` and `settlement_lines` are append-only. Not "an API that refuses" and
      -- not a soft delete: the application role is not granted UPDATE or DELETE on them at all,
      -- so an attempt is refused by Postgres regardless of what the application code does.
      --
      -- Migrations run as the owner role. Services connect as :app_role.
      --
      -- Note on style: psql does NOT substitute :'vars' inside dollar-quoted blocks, so the
      -- values are handed to PL/pgSQL through set_config/current_setting instead.

      \set ON_ERROR_STOP on

      -- Output suppressed: set_config echoes its argument, and the app password must not
      -- reach the migration logs.
      \o /dev/null
      SELECT set_config('mopay.app_role', :'app_role', false);
      SELECT set_config('mopay.app_password', :'app_password', false);
      \o

      DO $$
      DECLARE
          r text := current_setting('mopay.app_role');
          p text := current_setting('mopay.app_password');
      BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = r) THEN
              EXECUTE format('CREATE ROLE %I LOGIN PASSWORD %L', r, p);
          ELSE
              EXECUTE format('ALTER ROLE %I LOGIN PASSWORD %L', r, p);
          END IF;
      END
      $$;

      GRANT CONNECT ON DATABASE :"db_name" TO :"app_role";
      GRANT USAGE  ON SCHEMA public       TO :"app_role";

      -- Default: the app may read and write everything.
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO :"app_role";
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO :"app_role";

      -- Then take it back on the two append-only tables. This is the constraint.
      REVOKE UPDATE, DELETE, TRUNCATE ON ledger_entries   FROM :"app_role";
      REVOKE UPDATE, DELETE, TRUNCATE ON settlement_lines FROM :"app_role";

      -- Make sure a future table created by the owner does not silently re-grant them.
      ALTER DEFAULT PRIVILEGES IN SCHEMA public
          GRANT SELECT, INSERT ON TABLES TO :"app_role";

      -- Verify, so a broken grant fails the migration rather than the demo.
      DO $$
      DECLARE
          r    text := current_setting('mopay.app_role');
          tbl  text;
          priv text;
      BEGIN
          FOREACH tbl IN ARRAY ARRAY['ledger_entries','settlement_lines'] LOOP
              FOREACH priv IN ARRAY ARRAY['UPDATE','DELETE'] LOOP
                  IF has_table_privilege(r, tbl, priv) THEN
                      RAISE EXCEPTION
                          'append-only enforcement failed: role % still holds % on % (README hard constraint 1)',
                          r, priv, tbl;
                  END IF;
              END LOOP;
              IF NOT has_table_privilege(r, tbl, 'INSERT') THEN
                  RAISE EXCEPTION
                      'role % lacks INSERT on % - the append path would be broken', r, tbl;
              END IF;
          END LOOP;
          RAISE NOTICE 'append-only enforcement verified on ledger_entries and settlement_lines for role %', r;
      END
      $$;
    mopay-003-house-account.psql: "-- The ledger's counterparty account.\n--\n-- PRD \xA77 gives LedgerEntry\
      \ no `account` column: an entry is identified by merchant_id plus\n-- direction. Double entry still\
      \ needs both sides of every transaction, so mopay's own book\n-- is represented as a reserved merchant\
      \ row. This is structural, not seed data - the ledger\n-- cannot write a balancing pair without\
      \ it, so it lives in a migration.\n--\n-- Sign convention (balance = SUM(credit) - SUM(debit) per\
      \ merchant):\n--   collection cleared : credit merchant, debit house   -> we owe the merchant more\n\
      --   fee charged        : debit  merchant, credit house  -> we owe less\n--   settlement paid  \
      \  : debit  merchant, credit house  -> we owe less\n-- A fully settled merchant therefore returns\
      \ to a zero balance.\n\n\\set ON_ERROR_STOP on\n\nINSERT INTO merchants (\n    id, name, country,\
      \ data_region,\n    payout_bank, payout_account_number, payout_account_name,\n    float_limit_minor,\
      \ float_limit_currency\n) VALUES (\n    :'house_id',\n    'mopay house account',\n    :'region',\n\
      \    :'region',\n    'n/a', 'n/a', 'n/a',\n    0,\n    CASE :'region' WHEN 'KE' THEN 'KES' ELSE\
      \ 'NGN' END\n)\nON CONFLICT (id) DO NOTHING;\n"
    mopay-004-drop-run-environment.psql: |
      -- Remove settlement_runs.environment.
      --
      -- The column recorded which environment produced a run, written from each component's
      -- ENVIRONMENT variable. Nothing ever read it as a predicate - every query against
      -- settlement_runs filters on `region` - and it could not discriminate anyway: prod-ke and
      -- prod-ng hold separate databases (hard constraint 7), so every row in a given database
      -- carried the same value. The platform already labels logs and metrics with the
      -- environment it collected them from, which is the one source of that fact worth keeping.
      --
      -- 001 no longer creates the column. This migration exists for databases provisioned
      -- before that change; it is idempotent and a no-op on a fresh one.
      ALTER TABLE settlement_runs DROP COLUMN IF EXISTS environment;
environmentConfigs:
  initEnv:
    REGION: "<KE or NG \u2014 per environment>"
    HOUSE_ID: mopay_house
